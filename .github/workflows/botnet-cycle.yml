name: KiriPedia botnet cycle

# Runs one full botnet pipeline cycle and commits the updated
# public/botnet-snapshot.json so /meet-the-team reflects real activity.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: botnet-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Run cycle
        env:
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
        run: node botnet/run-cycle.mjs --skip-discovery
      - name: Commit snapshot
        run: |
          git config user.name "kiripedia-bot"
          git config user.email "bot@kiripedia.org"
          git add public/botnet-snapshot.json
          git diff --staged --quiet || git commit -m "botnet: update snapshot [skip ci]"
          git push
