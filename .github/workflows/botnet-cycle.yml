name: KiriPedia botnet cycle

# Runs one full botnet pipeline cycle and commits the updated
# public/botnet-snapshot.json so /meet-the-team reflects real activity.
on:
  # Scheduled cron disabled — HF Space (zerocool69/kiripedia) runs the loop
  # continuously now. Workflow_dispatch kept for manual one-off runs.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: botnet-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Run cycle
        env:
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
        run: node botnet/run-cycle.mjs
      - name: Commit snapshot
        run: |
          git config user.name "kiripedia-bot"
          git config user.email "bot@kiripedia.org"
          git add public/botnet-snapshot.json
          if git diff --staged --quiet; then
            echo "no snapshot changes"; exit 0
          fi
          git commit -m "botnet: update snapshot [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 3))
          done
          echo "push failed after 5 attempts"; exit 1
