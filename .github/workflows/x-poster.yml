name: KiriPedia X queue generator

# Generates a fresh batch of ready-to-paste posts every 2 days into
# tools/x-queue.md. Buffer free holds ~10 queued/channel; at 5 posts/day
# that's ~2 days of runway, so we refill every 2 days.
#
# When you later fund X pay-per-use, switch to direct posting by running
# `node tools/x-poster.mjs` (no --batch) on a per-slot schedule instead.
on:
  schedule:
    - cron: '0 13 */2 * *'   # every 2 days, 9:00 ET
  workflow_dispatch:
    inputs:
      count:
        description: 'How many posts to generate'
        default: '10'

concurrency:
  group: x-poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate batch
        run: node tools/x-poster.mjs --batch ${{ inputs.count || '10' }}
      - name: Commit queue + state
        run: |
          git config user.name "kiripedia-bot"
          git config user.email "bot@kiripedia.org"
          git add tools/x-queue.md tools/x-bot-state.json
          git diff --staged --quiet || git commit -m "x-bot: refresh post queue [skip ci]"
          git push
