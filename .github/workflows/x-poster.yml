name: KiriPedia X auto-poster

# Posts ONE item per run via headless browser (free, cookie auth).
# 8 slots/day, every 3 hours (EDT = UTC-4).
# Re-armed 2026-07-11: auto-posting resumed. Deploy-bombing is no longer a
# risk — vercel.json disables deploy-on-push, so these state commits don't
# trigger site rebuilds. Cookies kept fresh by the Mac cookie-refresh agent.
on:
  schedule:
    - cron: '0 0 * * *'    # 8:00 PM ET
    - cron: '0 3 * * *'    # 11:00 PM ET
    - cron: '0 6 * * *'    # 2:00 AM ET
    - cron: '0 9 * * *'    # 5:00 AM ET
    - cron: '0 12 * * *'   # 8:00 AM ET
    - cron: '0 15 * * *'   # 11:00 AM ET
    - cron: '0 18 * * *'   # 2:00 PM ET
    - cron: '0 21 * * *'   # 5:00 PM ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print only, do not post)'
        type: boolean
        default: false

concurrency:
  group: x-poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Post (or dry-run)
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/x-poster.mjs --dry-run
          else
            node tools/x-poster.mjs --browser
          fi
      - name: Upload error screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x-browser-error
          path: tools/x-browser-error.png
          if-no-files-found: ignore
      - name: Commit updated state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "kiripedia-bot"
          git config user.email "bot@kiripedia.org"
          git add tools/x-bot-state.json
          git diff --staged --quiet || git commit -m "x-bot: update post state [skip ci]"
          git push
